name: titan-daily
on:
  schedule:
    - cron: "30 17 * * 1-5"   # 17:30 UTC = 18:30 in inverno / 19:30 in estate, dopo la chiusura di Borsa Italiana (17:35)
  workflow_dispatch: {}       # pulsante "Run workflow" per lanciarlo subito
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - name: Ripristina l'ultimo dato valido
        uses: actions/cache@v4
        with:
          path: cache/data.json
          key: data-${{ github.run_id }}
          restore-keys: data-
      - run: python titan.py
        env:
          TITAN_PIN: ${{ secrets.TITAN_PIN }}   # PIN del sito (segreto del repository, non scritto nel codice)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
