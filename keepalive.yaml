name: keepalive
# GitHub sospende i workflow programmati dopo 60 giorni senza attività nel repository: questo li tiene attivi (1 volta al mese).
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "titan-bot"
          git config user.email "titan-bot@users.noreply.github.com"
          git commit --allow-empty -m "keepalive"
          git push
